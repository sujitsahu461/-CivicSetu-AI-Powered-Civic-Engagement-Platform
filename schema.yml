      operationId: api_v1_users_profile_update_partial_update
      description: Partially update profile fields.
      summary: Partially update own profile
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/users/profile/upload-image/:
    post:
      operationId: api_v1_users_profile_upload_image_create
      description: Upload or replace the authenticated user's profile image. Max 5
        MB, JPEG/PNG/WebP.
      summary: Upload profile image
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileImageRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
        '400':
          description: Invalid image file.
  /api/v1/users/search/:
    get:
      operationId: api_v1_users_search_list
      description: Search and filter all platform users. Supports free-text query
        across email, name, and phone, plus role and status filters.
      summary: Search users (admin only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by email, name, or phone
      - in: query
        name: role
        schema:
          type: string
          enum:
          - AUTHORITY
          - CITIZEN
          - SUPER_ADMIN
        description: Filter by role
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
        description: Filter by status
      tags:
      - User Management
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSearchList'
          description: ''
components:
  schemas:
    AICityInsights:
      type: object
      description: City-wide predictive civic analytics metrics.
      properties:
        total_ai_scans:
          type: integer
        average_urgency_index:
          type: number
          format: double
        high_hazard_alerts_count:
          type: integer
        top_predicted_categories:
          type: array
          items:
            type: object
            additionalProperties: {}
        category_distribution:
          type: array
          items:
            type: object
            additionalProperties: {}
        system_readiness_status:
          type: string
        model_version:
          type: string
        last_updated:
          type: string
      required:
      - average_urgency_index
      - category_distribution
      - high_hazard_alerts_count
      - last_updated
      - model_version
      - system_readiness_status
      - top_predicted_categories
      - total_ai_scans
    AIDuplicateCheckRequestRequest:
      type: object
      description: Input payload for checking potential duplicate complaints.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/CategoryEnum'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        radius_km:
          type: number
          format: double
          maximum: 25.0
          minimum: 0.1
          default: 1.5
      required:
      - category
      - description
      - title
    AIDuplicateMatch:
      type: object
      description: Individual match candidate in duplicate analysis.
      properties:
        complaint_public_id:
          type: string
          format: uuid
        tracking_code:
          type: string
        title:
          type: string
        status:
          type: string
        location_address:
          type: string
        distance_km:
          type: number
          format: double
          nullable: true
        similarity_score:
          type: number
          format: double
        match_confidence:
          type: string
        matched_tokens:
          type: array
          items:
            type: string
      required:
      - complaint_public_id
      - distance_km
      - location_address
      - match_confidence
      - matched_tokens
      - similarity_score
      - status
      - title
      - tracking_code
    AITriageRequestRequest:
      type: object
      description: Input payload for classifying grievance text.
      properties:
        title:
          type: string
          minLength: 1
          description: Title or subject of the complaint
          maxLength: 200
        description:
          type: string
          minLength: 1
          description: Detailed description of the civic issue
        location_address:
          type: string
          default: ''
          description: Optional address or landmark for context
      required:
      - description
      - title
    AITriageResponse:
      type: object
      description: Output predictions including category, priority, and hazard assessment.
      properties:
        predicted_category:
          $ref: '#/components/schemas/PredictedCategoryEnum'
        confidence_score:
          type: number
          format: double
        urgency_score:
          type: integer
        predicted_priority:
          $ref: '#/components/schemas/PredictedPriorityEnum'
        detected_keywords:
          type: array
          items:
            type: string
        hazard_tags:
          type: array
          items:
            type: string
        sentiment:
          type: string
        estimated_resolution_hours:
          type: integer
      required:
      - confidence_score
      - detected_keywords
      - estimated_resolution_hours
      - hazard_tags
      - predicted_category
      - predicted_priority
      - sentiment
      - urgency_score
    AdminProfile:
      type: object
      description: Full read-only profile for super-admin users — includes all fields.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role027Enum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF08Enum'
          readOnly: true
        bio:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserDepartmentAssignment'
          readOnly: true
        profile_image:
          type: string
          format: uri
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
