openapi: 3.0.3
info:
  title: CivicSetu API
  version: 1.0.0
  description: Backend API for the CivicSetu AI-powered civic engagement platform.
paths:
  /api/v1/ai/city-insights/:
    get:
      operationId: api_v1_ai_city_insights_retrieve
      description: Retrieve city-wide predictive insights, hazard alerts, and category
        distributions.
      summary: Get city-wide AI civic insights
      tags:
      - AI Predictions
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICityInsights'
          description: ''
  /api/v1/ai/classify/:
    post:
      operationId: api_v1_ai_classify_create
      description: Classify grievance text and predict urgency, priority, and hazard
        tags.
      summary: AI automated complaint triage & classification
      tags:
      - AI Predictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITriageRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AITriageRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AITriageRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITriageResponse'
          description: ''
        '400':
          description: Invalid request payload
  /api/v1/ai/complaint/{complaint_public_id}/prediction/:
    get:
      operationId: api_v1_ai_complaint_prediction_retrieve
      description: Retrieve or generate AI predictions for a specific complaint.
      summary: Get AI analysis for a complaint
      parameters:
      - in: path
        name: complaint_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - AI Predictions
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITriageResponse'
          description: ''
        '404':
          description: Complaint not found
  /api/v1/ai/detect-duplicates/:
    post:
      operationId: api_v1_ai_detect_duplicates_create
      description: Scan open complaints to identify duplicate grievances using geospatial
        proximity and NLP.
      summary: AI duplicate complaint detection
      tags:
      - AI Predictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIDuplicateCheckRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIDuplicateCheckRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIDuplicateCheckRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIDuplicateMatch'
          description: ''
        '400':
          description: Validation error
  /api/v1/audit-logs/:
    get:
      operationId: api_v1_audit_logs_list
      description: List system audit logs with filtering and pagination (Super Admin
        only).
      summary: List and filter audit logs
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - AUTH_LOGIN
          - AUTH_LOGOUT
          - AUTH_REGISTER
          - PASSWORD_CHANGE
          - PROFILE_UPDATE
          - COMPLAINT_CREATED
          - COMPLAINT_STATUS_UPDATE
          - COMPLAINT_PRIORITY_UPDATE
          - COMPLAINT_ASSIGNED
          - DEPARTMENT_CREATED
          - DEPARTMENT_UPDATED
          - AUTHORITY_ASSIGNED
          - FEEDBACK_SUBMITTED
          - AI_TRIAGE_RUN
          - SYSTEM_EVENT
          type: string
          minLength: 1
        description: |-
          * `AUTH_LOGIN` - User Login
          * `AUTH_LOGOUT` - User Logout
          * `AUTH_REGISTER` - User Registration
          * `PASSWORD_CHANGE` - Password Changed
          * `PROFILE_UPDATE` - Profile Updated
          * `COMPLAINT_CREATED` - Complaint Created
          * `COMPLAINT_STATUS_UPDATE` - Complaint Status Updated
          * `COMPLAINT_PRIORITY_UPDATE` - Complaint Priority Updated
          * `COMPLAINT_ASSIGNED` - Authority Assigned to Complaint
          * `DEPARTMENT_CREATED` - Department Created
          * `DEPARTMENT_UPDATED` - Department Updated
          * `AUTHORITY_ASSIGNED` - Authority Assigned to Department
          * `FEEDBACK_SUBMITTED` - Feedback Submitted
          * `AI_TRIAGE_RUN` - AI Triage Executed
          * `SYSTEM_EVENT` - System Event
      - in: query
        name: actor_email
        schema:
          type: string
          minLength: 1
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
      - in: query
        name: entity_type
        schema:
          type: string
          minLength: 1
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{public_id}/:
    get:
      operationId: api_v1_audit_logs_retrieve
      description: Retrieve specific audit log entry by public UUID (Super Admin only).
      summary: Get audit log details
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
        '404':
          description: Audit log entry not found
  /api/v1/audit-logs/summary/:
    get:
      operationId: api_v1_audit_logs_summary_retrieve
      description: Retrieve aggregate security and activity summary metrics (Super
        Admin only).
      summary: Get audit log activity summary
      tags:
      - Audit Logs
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogSummary'
          description: ''
  /api/v1/auth/forgot-password/:
    post:
      operationId: api_v1_auth_forgot_password_create
      summary: Request a password reset email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Password reset email queued if the account exists.
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      summary: Login with email and password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      summary: Logout by blacklisting the refresh token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '205':
          description: Refresh token blacklisted.
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      summary: Get the authenticated user profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      summary: Refresh JWT access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      summary: Register a citizen or authority account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: api_v1_auth_reset_password_create
      summary: Confirm password reset with uid and token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Password reset completed.
  /api/v1/auth/verify/:
    post:
      operationId: api_v1_auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      summary: Verify a JWT token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/authority/analytics/department/:
    get:
      operationId: api_v1_authority_analytics_department_list
      description: Returns per-category complaint breakdown with resolution rates.
      summary: Category performance
      tags:
      - Authority - Analytics
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryPerformanceItem'
          description: ''
  /api/v1/authority/analytics/priority/:
    get:
      operationId: api_v1_authority_analytics_priority_retrieve
      description: Returns complaint count and percentage by priority level for the
        authority's scope.
      summary: Priority breakdown
      tags:
      - Authority - Analytics
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityBreakdown'
          description: ''
  /api/v1/authority/analytics/stats/:
    get:
      operationId: api_v1_authority_analytics_stats_retrieve
      description: Returns status breakdown, average resolution time, and daily trend
        for the authority's scope.
      summary: Complaint statistics
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Period in days (default 30)
      tags:
      - Authority - Analytics
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintStats'
          description: ''
  /api/v1/authority/complaints/:
    get:
      operationId: api_v1_authority_complaints_list
      description: Paginated list of complaints in the authority's department(s) or
        assigned directly, with search and filters.
      summary: List authority complaints
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - URGENT
        description: Filter by priority
      - in: query
        name: q
        schema:
          type: string
        description: Search query
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - IN_PROGRESS
          - PENDING
          - REJECTED
          - RESOLVED
        description: Filter by status
      tags:
      - Authority - Complaints
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComplaintListList'
          description: ''
  /api/v1/authority/complaints/{public_id}/:
    get:
      operationId: api_v1_authority_complaints_retrieve
      description: Retrieve full details, images, and latest history for a complaint.
      summary: Complaint details
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/authority/complaints/{public_id}/notes/:
    post:
      operationId: api_v1_authority_complaints_notes_create
      description: Add or update resolution notes. Triggers a notification to the
        citizen.
      summary: Add resolution notes
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionNotesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolutionNotesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolutionNotesRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
    patch:
      operationId: api_v1_authority_complaints_notes_partial_update
      description: Add or update resolution notes. Triggers a notification to the
        citizen.
      summary: Add resolution notes
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResolutionNotesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResolutionNotesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResolutionNotesRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/authority/complaints/{public_id}/priority/:
    post:
      operationId: api_v1_authority_complaints_priority_create
      description: Change complaint priority level and optionally add remarks.
      summary: Update complaint priority
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
    patch:
      operationId: api_v1_authority_complaints_priority_partial_update
      description: Change complaint priority level and optionally add remarks.
      summary: Update complaint priority
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPriorityUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPriorityUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPriorityUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/authority/complaints/{public_id}/resolution-image/:
    post:
      operationId: api_v1_authority_complaints_resolution_image_create
      description: Upload a resolution evidence image (JPEG/PNG/WebP, max 5MB) attached
        to the complaint.
      summary: Upload resolution image
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionImageUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolutionImageUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolutionImageUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintImage'
          description: ''
  /api/v1/authority/complaints/{public_id}/status/:
    post:
      operationId: api_v1_authority_complaints_status_create
      description: Change complaint status and optionally add resolution remarks.
        Triggers a notification to the citizen.
      summary: Update complaint status
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthorityStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorityStatusUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
    patch:
      operationId: api_v1_authority_complaints_status_partial_update
      description: Change complaint status and optionally add resolution remarks.
        Triggers a notification to the citizen.
      summary: Update complaint status
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authority - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAuthorityStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAuthorityStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAuthorityStatusUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/authority/dashboard/recent/:
    get:
      operationId: api_v1_authority_dashboard_recent_list
      description: Returns the 5 most recently created complaints in the authority's
        scope.
      summary: Recent complaints
      tags:
      - Authority - Dashboard
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintList'
          description: ''
  /api/v1/authority/dashboard/summary/:
    get:
      operationId: api_v1_authority_dashboard_summary_retrieve
      description: Returns complaint counts by status, urgent count, today's new,
        and total assigned for the authority's scope.
      summary: Dashboard summary
      tags:
      - Authority - Dashboard
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
  /api/v1/authority/notifications/:
    get:
      operationId: api_v1_authority_notifications_list
      description: Returns paginated notifications for the user, optionally filtered
        by read/unread status.
      summary: List notifications
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
        description: 'Filter: true/false'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/authority/notifications/mark-all-read/:
    post:
      operationId: api_v1_authority_notifications_mark_all_read_create
      description: Mark all unread notifications as read for the authenticated user.
      summary: Mark all notifications as read
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/authority/notifications/mark-read/:
    post:
      operationId: api_v1_authority_notifications_mark_read_create
      description: Mark one or more specific notifications as read by their UUIDs.
      summary: Mark notifications as read
