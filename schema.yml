    AuditLog:
      type: object
      description: Serializer for AuditLog entries.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        actor_role:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditLogActionEnum'
          readOnly: true
        entity_type:
          type: string
          readOnly: true
          description: Type of entity affected (e.g. Complaint, User, Department,
            Feedback)
        entity_id:
          type: string
          readOnly: true
          description: Identifier or tracking code of affected entity
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        metadata:
          readOnly: true
          description: Additional context, diffs, or payload attributes
        created_at:
          type: string
          format: date-time
          readOnly: true
